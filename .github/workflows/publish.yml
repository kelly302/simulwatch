# 手動のビルドとアップロード（docs/workflows.md 3-2）。巡回・AI の答えの取り込みはしない。
# site:data が作品の公開キーと lastmod の表を DB に書くので、日次と同じく DB を書き戻す（同じ concurrency の組）。
# 使いどころ: 最初の公開の前の確認（preview → 確認 → production）、ルールの変更の反映（resolve_all）、検査で止まったときの直し（accept_db）
name: publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "アップロード先（R2_PREFIX があるときは preview だけ）"
        type: choice
        options: [production, preview]
        default: production
      force:
        description: "指紋が本番と同じでもアップロードする"
        type: boolean
        default: true
      resolve_all:
        description: "resolve --all で名寄せし直す（ルールを直して push したあと。Annict を呼ぶ）"
        type: boolean
        default: false
      accept_db:
        description: "DB の sha256 と行数の照合を飛ばす（検査で止まり続けたときの直し。docs/workflows.md 2-3）"
        type: boolean
        default: false

concurrency:
  group: simulwatch-db
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_CLI_VERSION: "2.39.1"
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  R2_PREFIX: ${{ vars.R2_PREFIX }}
  TARGET: ${{ inputs.target }}
  WRITER: publish
  FORCE: ${{ inputs.force }}
  ACCEPT_DB: ${{ inputs.accept_db }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: npm ci
        timeout-minutes: 10
        run: npm ci
      - name: AWS CLI
        timeout-minutes: 5
        run: bash scripts/ci/install-aws.sh
      - name: start
        id: start
        run: bash scripts/ci/job.sh start

      - name: pull
        id: pull
        timeout-minutes: 5
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/ci/job.sh pull
      # resolve_all のときだけ Annict を渡す（YouTube は渡さない）
      - name: resolve --all
        if: inputs.resolve_all
        continue-on-error: true
        timeout-minutes: 60
        env:
          ANNICT_TOKEN: ${{ secrets.ANNICT_TOKEN }}
        run: bash scripts/ci/job.sh resolve-all
      - name: site:data
        continue-on-error: true
        timeout-minutes: 5
        run: bash scripts/ci/job.sh site-data
      - name: push
        id: push
        if: always() && steps.pull.outcome == 'success'
        timeout-minutes: 5
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/ci/job.sh push
      - name: raw
        if: always() && steps.pull.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/ci/job.sh raw

      - name: fingerprint
        id: fp
        if: success() && steps.pull.outcome == 'success'
        timeout-minutes: 2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/ci/job.sh fingerprint
      - name: og-cache restore
        if: steps.fp.outputs.build == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/site/og-cache
          key: og-${{ github.run_id }}
          restore-keys: og-
      - name: build
        if: steps.fp.outputs.build == 'true'
        timeout-minutes: 20
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: bash scripts/ci/job.sh build
      - name: check dist
        if: steps.fp.outputs.build == 'true'
        timeout-minutes: 2
        run: bash scripts/ci/job.sh check-dist
      - name: upload
        id: upload
        if: steps.fp.outputs.build == 'true'
        timeout-minutes: 10
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.155.0"
          command: ${{ env.TARGET == 'production' && 'deploy' || 'versions upload --preview-alias preview' }}
      - name: upload の URL
        if: steps.upload.outcome == 'success'
        env:
          URL: ${{ steps.upload.outputs.deployment-url }}
        run: |
          echo "アップロード先 ${TARGET}: ${URL:-（出力に URL が無い。上のログの Version Preview URL を見る）}"
          echo "- アップロード（${TARGET}）: ${URL:-ログを見る}" >> "$GITHUB_STEP_SUMMARY"
      - name: last-deploy
        if: steps.upload.outcome == 'success' && env.TARGET == 'production'
        timeout-minutes: 2
        env:
          FINGERPRINT: ${{ steps.fp.outputs.fingerprint }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/ci/job.sh last-deploy
      - name: og-cache save
        if: always() && steps.fp.outputs.build == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/site/og-cache
          key: og-${{ hashFiles('data/site/og-cache/**') }}
      - name: summary
        if: always() && steps.start.outcome == 'success'
        timeout-minutes: 2
        env:
          JOB_STARTED_AT: ${{ steps.start.outputs.started_at }}
        run: bash scripts/ci/job.sh summary
