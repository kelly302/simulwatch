# Tier 1 の取得元（各事務所の公式サイト）
#
# - 取得に失敗した事務所は前回の一覧をそのまま使う（卒業扱いにしない）
# - 取得件数が min_count を下回ったら、サイト改修で抜き出しが壊れたとみなして失敗扱いにする

nijisanji:
  # 公式サイトのライバー一覧API（affiliation=nijisanji は日本の所属。統合した旧 KR・旧 ID を含む）
  list_url: "https://www.nijisanji.jp/api/livers?limit=300&orderKey=subscriber_count&order=desc&affiliation=nijisanji&locale=ja"
  # ほかの一覧と、その区分（2026-10-02 決定で NIJISANJI EN を対象に入れた）
  extra_lists:
    - url: "https://www.nijisanji.jp/api/livers?limit=300&orderKey=subscriber_count&order=desc&affiliation=nijisanjien&locale=ja"
      branch: en
  detail_url: "https://www.nijisanji.jp/talents/l/{slug}"
  min_count: 100
  # 所属の中の区分（UI の絞り込み用）。一覧には統合した旧 NIJISANJI KR・ID のライバーも入っていて、プロフィールの項目名がその言語になっている。
  # 項目名がこれに当たれば その区分、当たらなければ jp（日本）
  branch_markers:
    kr: ["생일", "팬클럽 이름"]
    id: ["Ulang Tahun", "Nama Fans"]

hololive:
  group_url: "https://hololive.hololivepro.com/talents?gp={group}"
  # 英語版の一覧。英語の名前を取る（EN の配信者に併記する。2026-10-03 確認）。名前の先頭の「[Affiliate]」「[Alum]」は外す
  en_group_url: "https://hololive.hololivepro.com/en/talents?gp={group}"
  detail_url: "https://hololive.hololivepro.com/talents/{slug}/"
  # 対象の所属グループ。ID（area15・holoro・holoh3ro）・卒業生（alum）・スタッフ・holoAN（公式アナウンサー。holoAN room は番組「昼ホロ」のチャンネル。2026-10-03 決定）は含めない。
  # EN（myth・council・promise・advent・justice・project-hope）は 2026-10-02 決定で対象に入れた（区分は group_branch）
  groups:
    - gen-0
    - 1stgen
    - gen-2
    - gamers
    - gen-3
    - gen-4
    - gen-5
    - holox
    - regloss
    - flow-glow
    - asobi-mawari-tai
    - myth
    - council
    - promise
    - advent
    - justice
    - project-hope
  # グループの区分（書いていないグループは jp）
  group_branch:
    myth: en
    council: en
    promise: en
    advent: en
    justice: en
    project-hope: en
  # 名前にこれを含むタレントは巡回しない（卒業・活動終了・退職）
  inactive_name_markers:
    - 【卒業生】
    - 【配信活動終了】
    - 【退職】
  # タレントページに載っている事務所の公式チャンネル（タレント本人のチャンネルと取り違えない）
  exclude_channel_ids:
    - UCJFZiqLMntJufDCHc6bQixg   # hololive ホロライブ - VTuber Group
  min_count: 30

vspo:
  list_url: "https://vspo.jp/member/"
  # メンバー一覧の li 要素に付くクラス。日本の所属だけを取る
  japanese_class: "--japanese"
  min_count: 15
