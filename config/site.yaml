# サイト（Phase 3）の設定。ジョブの書き出し（site:data）と Astro のビルドの両方が読む

# サイトの URL（canonical・sitemap・og:url に入る）。**仮**。Pages か Workers か・独自ドメインは公開の前に決める（2026-10-19 の決定 D）
site_url: "https://simulwatch.example"
# サイトの名前（2026-10-22 ユーザー決定）。title・ヘッダー・フッター・og:image はここから作る
site_name: "VTuber 同時視聴まとめ"

# 予定枠・配信中の枠をサイト用のデータに入れるか（2026-10-27 の決定 D-01 で false。定期実行は日次だけで、トップの「これから始まる枠」は無い。
# 終わった枠だけを出し、予定枠・配信中の枠は終わってから判定されて出る）。true にすると予定枠・配信中の枠も events に入る
# （表示する UI と、判定待ちの予定枠を枠として出す publishState の分岐は消したので、戻すときは別に作る。docs/workflows.md の付録）
publish_upcoming: false
# publish_upcoming が true のとき、予定時刻（無ければ started_at）からこの時間を過ぎた upcoming の枠は出さない（ビルドの時刻で判定する）
upcoming_stale_hours: 6

top:
  # ランキングの枠数（期間ごと。7日・30日・全期間）。トップの順位表は5位まで、続きはランキングのページ（/ranking/）に30位まで（2026-10-21 ユーザー決定）
  ranking_top: 5
  ranking_page: 30
  ranking_periods: [7, 30, 0]   # 0 は全期間
  # 「同時視聴した枠」で HTML に入れる新しい順の枠数と、「さらに表示」で読む JSON の枠数
  recent_html: 24
  recent_json: 300

# 作品一覧の1ページの件数（HTML のページ送りと、並び順ごとの JSON）
works_page_size: 300
