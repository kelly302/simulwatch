# 照合用の正規化
match_normalize:
  # 取り除く記号（全角は NFKC で半角になってから適用）
  strip_chars: " \t　・･!！?？、。,.：:;；/／-‐－―~〜～…‥'\"“”‘’()（）[]［］「」『』【】〈〉《》☆★♪♡♥◆◇■□●○→←〆※*＊＃#&＆+＋=＝|｜_"
  # 期・シーズンの表記ゆれを "seasonN" にそろえる
  season_patterns:
    - "第(\\d+)期"
    - "(\\d+)期"
    - "season(\\d+)"
    - "シーズン(\\d+)"
    - "(\\d+)(?:st|nd|rd|th)season"

# 照会先ごとの設定
annict:
  # 1回の照会にまとめる検索語の数
  batch_size: 5
  per_query: 50
anilist:
  batch_size: 5
wikipedia:
  # 完全一致が作品でない（小説・漫画・曖昧さ回避）ときに試す記事名の接尾辞
  title_suffixes:
    - " (映画)"
    - " (テレビドラマ)"
    - " (ドラマ)"
    - " (アニメ)"
    - " (特撮)"
    - " (テレビアニメ)"
  # Wikidata の P31（instance of）。作品として受け付けるクラスと、そのときの media
  work_classes:
    Q11424: movie        # 映画
    Q20650540: movie     # アニメ映画
    Q202866: movie       # アニメーション映画
    Q24862: movie        # 短編映画
    Q93204: movie        # ドキュメンタリー映画
    Q29168811: movie     # アニメーション長編映画
    Q5398426: tv         # テレビ番組シリーズ
    Q63952888: tv        # テレビアニメシリーズ
    Q1261214: tv         # 特別番組
    Q3464665: tv         # テレビシリーズのシーズン
    Q1259759: tv         # ミニシリーズ
    Q581714: tv          # アニメテレビシリーズ（一般）
    Q526877: web         # ウェブシリーズ
    Q220898: ova         # OVA
    Q1107: tv            # アニメ（汎用）
  # 作品ではないと分かるクラス（理由の表示用。受け付けないのは work_classes 以外すべて）
  not_work_classes:
    Q21198342: 漫画
    Q7725634: 文学作品
    Q196600: メディア・フランチャイズ
