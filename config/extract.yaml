# not_a_work の語に当たっても、作品名だと明示された括弧（「映画「さがす」」「アニメ『かくしごと』」）があれば、
# その括弧の中身だけを照会する。作品に当たれば同定し、当たらなければ「作品ではない」のまま。
# not_a_work の語はハッシュタグの中も見る（大会名・イベント名はタグに書かれることが多い。「#日本ダービー」）。
# そのため配信者のタグの語にも当たる（「#ロボ子生放送」の「生放送」で映画の枠が作品ではないになった。2026-10-01 の audit-2）
not_a_work_quote_override: "(映画|アニメ|劇場版|ドラマ)\\s*[「『]"

# 企画名・番組名（作品名ではない）。区間がこれを含めば作品名の候補にしない。
# 作品名がほかに見つからなければ「同時視聴だが作品を特定できない」にする（作品ではない、とは分ける）
program_names:
  - おはすず          # 七瀬すず菜の「おはすず日曜日（拡大版）」。ニチアサの作品は概要欄に列挙される

# 区間の区切りに使わず、区間からも外さない「タグの括弧」。中身が tag_words を含む区間は捨てる
# 角括弧 [ ] は作品名の一部に使われる（「Fate/stay night [Unlimited Blade Works]」）のでタグの括弧に入れない
tag_brackets:
  - ["【", "】"]
  - ["〖", "〗"]
  - ["〔", "〕"]

# 作品名を括ることが多い括弧。中身をそれぞれ独立した区間として優先的に試す
quote_brackets:
  - ["『", "』"]
  - ["「", "」"]
  - ["〈", "〉"]
  - ["《", "》"]
# “ ” は作品名の中の記号として使われる（「ザ・スーサイド・スクワッド “極”悪党、集結」「IT/イット “それ”が見えたら、終わり。」）ので括弧にしない

# タグの括弧の中にこれがあれば、その括弧は配信者名・所属などのタグとして丸ごと捨てる
