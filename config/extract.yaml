# 方針: 取りこぼしより誤同定のほうが害が大きい。
#   - タイトルを「区間」に切り分け、区間まるごと（前後の無視してよい語を除く）が作品名と一致したときだけ採用する
#   - 区間の一部だけが作品名に一致しても採用しない（例:「鋼の錬金術師FA」を「鋼の錬金術師」(2003) にしない）
# このファイルを変えるとルールのバージョンが変わる。`npm run cli -- resolve --all` で再処理する。

# 作品ではない同時視聴。タイトルにこれがあれば照会せず、unresolved の「作品ではない」に分ける。
