  - asmr

# 区間の区切りに使わず、区間からも外さない「タグの括弧」。中身が tag_words を含む区間は捨てる
tag_brackets:
  - ["【", "】"]
  - ["〖", "〗"]
  - ["［", "］"]
  - ["[", "]"]
  - ["〔", "〕"]

# 作品名を括ることが多い括弧。中身をそれぞれ独立した区間として優先的に試す
quote_brackets:
  - ["『", "』"]
  - ["「", "」"]
  - ["〈", "〉"]
  - ["《", "》"]
  - ["“", "”"]

# タグの括弧の中にこれがあれば、その括弧は配信者名・所属などのタグとして丸ごと捨てる
tag_words:
  - にじさんじ
  - nijisanji
  - ホロライブ
  - hololive
  - ぶいすぽ
  - vspo
  - 所属
  - 期生
  - reglos
  - flowglow

# 区間の中から取り除く語（確実なノイズだけ）。取り除いた位置は区間の区切りになる（前後は別の区間）。
# 短い一般語（する・みる など）は作品名を壊すのでここに入れず、trim_words（区間の端だけ）に入れる
noise_words:
  - 本日の同時視聴は
  - 今日の同時視聴は
  - の同時視聴は
  - 同時視聴は
  - 完全初見の
  - 初見の
  - 同時視聴会
  - 同時視聴枠
  - 同時視聴配信
  - 同時視聴
  - 同時試聴会
  - 同時試聴
  - ミラー配信
  - ウォッチパーティー
  - ウォッチパーティ
  - watch party
  - watchparty
  - watch along
  - watchalong
  - watching party
  - メンバー限定配信
  - メンバーシップ限定
  - メンバー限定
  - メン限
  - めん限
  - members only
  - member only
  - membership only
  - membersonly
  - memberonly
  - membership
  - 超完全初見
  - 完全初見
  - 初見
  - ネタバレ注意
  - ネタバレ
  - 吹き替え版
  - 吹き替え
  - 吹替版
  - 字幕版

# 区間の端（前後）にあれば外してよい語。外したあとで区間まるごとが作品名と一致するかを見る。
# 端にしか効かないので「恋する小惑星」の「する」は外れない
