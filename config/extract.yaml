  - 公式配信
  - 生放送
  - 新ファイター
  - アップデート
  - トレーラー
  - 東京ゲームショウ
  - "re:(^|[^a-z])tgs([^a-z]|$)"
  - hoyofair
  - appleイベント
  - iphone
  # スポーツ
  - 競馬
  - 天皇賞
  - 日本ダービー        # 「ウマ娘 プリティーダービー」を巻き込まないよう「ダービー」単体は入れない
  - オークス
  - 有馬記念
  - 菊花賞
  - 大相撲
  - 相撲
  - サッカー
  - 日本代表
  - ワールドカップ
  - w杯
  - jリーグ
  - "re:(^|[^a-z])j[123]([^a-z0-9]|$)"
  - mlb
  - wbc
  - 侍ジャパン
  - 甲子園
  - 野球
  - "re:(^|[^a-z])f1([^a-z0-9]|$)"
  - オリンピック
  - 五輪
  - プレミアリーグ
  # eスポーツ・大会
  - "re:(^|[^a-z])vct([^a-z]|$)"
  - valorantchampions
  - "re:(^|[^a-z])ljl([^a-z]|$)"
  - "re:(^|[^a-z])lol([^a-z]|$)"
  - "re:(^|[^a-z])worlds([^a-z]|$)"
  - ストリートファイターリーグ
  - "re:(^|[^a-z])sfl([^a-z]|$)"
  - redbull
  - riotgames
  - 大会
  - 杯
  - 選手権
  - プレイオフ
  - オールスター
  - playoffs
  # 事務所・配信者自身のコンテンツ
  - 初配信
  - お披露目
  - 3dlive
  - 3dライブ
  - 周年記念
  - 振り返り
  - ボイス
  - 歌ってみた
  - 歌みた
  - 切り抜き
  - にじフェス
  - nijisanjifes
  - にじさんじフェス
  - ホロフェス
  - hololivefes
  - zepp
  - ツアー
  - ロケ動画            # 「ロケ」単体は「ロケット」を巻き込む
  - セレモニー
  - 決起集会
