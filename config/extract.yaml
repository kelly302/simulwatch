# 期・続編を示す区間。同じタイトルにこれだけの区間が残っていたら（「進撃の巨人同時視聴！The Final Season …」）、
# シリーズ名だけの区間で当たった作品は別の期の可能性が高いので採用しない。照合キー（記号・空白を落とした小文字）に当てる正規表現
season_qualifiers:
  - "^(第?[0-9一二三四五六七八九十]+期)"
  - "^(the)?finalseason"
  - "^season[0-9]"
  - "^シーズン[0-9]"
  - "^[0-9]+(st|nd|rd|th)season"
  - "^part[0-9]"
  - "^続編"
  - "^完結編"
  - "^r[0-9]$"

# タイトルの期・部の表記（NFKC・小文字にしたタイトルに当てる正規表現）。tag の $1 は1つ目の捕獲（漢数字も読む）。
# 期（kind: season）: タイトルにあれば、その期を持たない作品には同定しない（アニメのDBは期ごとに別作品のため）。
#   suffixes は「区間 + 期の表記」で作品名を作り直して照合するときの、照合キーの末尾
# 部（kind: part）: 作品名に部の表記が無いことが多い（ジョジョ）。部が特定できなければ同定しない
title_markers:
  - { kind: season, re: "第?([0-9一二三四五六七八九十]+)\\s*期(?!生|間|限|待|目|末|中|的)", tag: "s$1", suffixes: ["season$1"] }
  - { kind: season, re: "(?:season|シーズン)\\s*([0-9]+)", tag: "s$1", suffixes: ["season$1"] }
  - { kind: season, re: "(?<![0-9])([0-9]{1,2})(?:st|nd|rd|th)\\s*(?:season|シーズン)", tag: "s$1", suffixes: ["season$1"] }
  - { kind: season, re: "第([0-9]+)シーズン", tag: "s$1", suffixes: ["season$1"] }
  - { kind: season, re: "(?:^|[^a-z0-9])r([2-9])(?:[^a-z0-9]|$)", tag: "s$1", suffixes: ["r$1", "season$1"] }
  - { kind: season, re: "(?:the\\s*)?final\\s*season|ファイナルシーズン", tag: "final", suffixes: ["thefinalseason", "finalseason"] }
  - { kind: season, re: "(?:^|[^a-z])after(?!\\s*(?:talk|life|party|dark|glow))(?:[^a-z]|$)|アフターストーリー", tag: "after", suffixes: ["afterstory"] }
  - { kind: season, re: "完結編", tag: "完結編", suffixes: ["完結編"] }
  - { kind: part, re: "第([0-9一二三四五六七八九十]+)部", tag: "p$1" }
  - { kind: part, re: "(?:^|[^a-z])part\\s*([0-9]+)", tag: "p$1" }

# 概要欄の作品名の列挙（「A、B、Cを見ます」）。読点で2つ以上並べ、末尾がこの動詞の行を作品名の列挙として切り出す。
# 行の末尾の記号は作品名の一部のことがある（「キミとアイドルプリキュア♪」）ので、動詞の後ろの絵文字・記号だけを外す
description_list_verbs:
  - 見ます
  - 観ます
  - 視聴します
  - みます

# 照合用の正規化
match_normalize:
  # 取り除く記号（全角は NFKC で半角になってから適用）
  # 「+」は落とさない（「ズートピア」と「ズートピア+」は別作品）
  strip_chars: " \t　・･!！?？、。,.：:;；/／-‐－―~〜～…‥'\"“”‘’()（）[]［］「」『』【】〈〉《》☆★♪♡♥◆◇■□●○→←〆※*＊＃#&＆=＝|｜_"
  # 期・シーズンの表記ゆれを "seasonN" にそろえる
  season_patterns:
    - "第(\\d+)期"
    - "(\\d+)期"
    - "season(\\d+)"
    - "第(\\d+)シーズン"
    - "シーズン(\\d+)"
    # 数字の前に数字があれば期の番号にしない（「機動戦士ガンダム00 2nd season」の「00」を吸い込んで season002 にしない）
    - "(?<![0-9])(\\d{1,2})(?:st|nd|rd|th)season"
    - "(?<![0-9])(\\d{1,2})(?:st|nd|rd|th)シーズン"
  # 見た目が同じで別の文字を寄せる（ギリシャ文字のゼータ「Ζ」とラテン文字の「Z」。「機動戦士Ζガンダム」）
  fold_chars:
    "ζ": "z"
    "Ζ": "z"

# 照会先ごとの設定
annict:
  # 1回の照会にまとめる検索語の数
  batch_size: 5
  per_query: 50
anilist:
  batch_size: 5
wikipedia:
  # 完全一致が作品でない（小説・漫画・曖昧さ回避）ときに試す記事名の接尾辞
  title_suffixes:
    - " (映画)"
    - " (テレビドラマ)"
    - " (ドラマ)"
    - " (アニメ)"
    - " (特撮)"
    - " (テレビアニメ)"
  # Wikidata の P31（instance of）。作品として受け付けるクラスと、そのときの media
  work_classes:
    Q11424: movie        # 映画
    Q20650540: movie     # アニメ映画
    Q202866: movie       # アニメーション映画
    Q24862: movie        # 短編映画
    Q93204: movie        # ドキュメンタリー映画
    Q29168811: movie     # アニメーション長編映画
    Q5398426: tv         # テレビ番組シリーズ
    Q63952888: tv        # テレビアニメシリーズ
    Q1261214: tv         # 特別番組
    Q3464665: tv         # テレビシリーズのシーズン
    Q1259759: tv         # ミニシリーズ
    Q581714: tv          # アニメテレビシリーズ（一般）
    Q526877: web         # ウェブシリーズ
    Q220898: ova         # OVA
    Q1107: tv            # アニメ（汎用）
  # アニメのクラス。アニメのDBで当たった区間を Wikipedia で照合するとき、これらは「同名の別作品」とみなさない
  # （「進撃の巨人 Season3」の記事はアニメ全体の記事へのリダイレクトで、公開年がずれるため）
  anime_classes:
    - Q63952888
    - Q20650540
    - Q202866
    - Q29168811
    - Q581714
    - Q1107
    - Q220898
  # 作品ではないと分かるクラス（理由の表示用。受け付けないのは work_classes 以外すべて）
  not_work_classes:
    Q21198342: 漫画
    Q7725634: 文学作品
    Q196600: メディア・フランチャイズ
    Q15275719: 定期行事
    Q2155186: 放送枠
    Q5: 人物
    Q7889: ゲーム
    Q4167410: 曖昧さ回避
