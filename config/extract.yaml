# 期・続編を示す区間。同じタイトルにこれだけの区間が残っていたら（「進撃の巨人同時視聴！The Final Season …」）、
# シリーズ名だけの区間で当たった作品は別の期の可能性が高いので採用しない。照合キー（記号・空白を落とした小文字）に当てる正規表現
season_qualifiers:
  - "^(第?[0-9一二三四五六七八九十]+期)"
  - "^(the)?finalseason"
  - "^season[0-9]"
  - "^シーズン[0-9]"
  - "^[0-9]+(st|nd|rd|th)season"
  - "^part[0-9]"
  - "^続編"
  - "^完結編"
  - "^r[0-9]$"

# タイトルの期・部の表記（NFKC・小文字にしたタイトルに当てる正規表現）。tag の $1 は1つ目の捕獲（漢数字も読む）。
# 期（kind: season）: タイトルにあれば、その期を持たない作品には同定しない（アニメのDBは期ごとに別作品のため）。
#   suffixes は「区間 + 期の表記」で作品名を作り直して照合するときの、照合キーの末尾
# 部（kind: part）: 作品名に部の表記が無いことが多い（ジョジョ）。部が特定できなければ同定しない
title_markers:
  - { kind: season, re: "第?([0-9一二三四五六七八九十]+)\\s*期(?!生|間|限|待|目|末|中|的)", tag: "s$1", suffixes: ["season$1"] }
  - { kind: season, re: "(?:season|シーズン)\\s*([0-9]+)", tag: "s$1", suffixes: ["season$1"] }
  - { kind: season, re: "(?<![0-9])([0-9]{1,2})(?:st|nd|rd|th)\\s*(?:season|シーズン)", tag: "s$1", suffixes: ["season$1"] }
  - { kind: season, re: "第([0-9]+)シーズン", tag: "s$1", suffixes: ["season$1"] }
  - { kind: season, re: "(?:^|[^a-z0-9])r([2-9])(?:[^a-z0-9]|$)", tag: "s$1", suffixes: ["r$1", "season$1"] }
  - { kind: season, re: "(?:the\\s*)?final\\s*season|ファイナルシーズン", tag: "final", suffixes: ["thefinalseason", "finalseason"] }
  - { kind: season, re: "(?:^|[^a-z])after(?!\\s*(?:talk|life|party|dark|glow))(?:[^a-z]|$)|アフターストーリー", tag: "after", suffixes: ["afterstory"] }
  - { kind: season, re: "完結編", tag: "完結編", suffixes: ["完結編"] }
  - { kind: part, re: "第([0-9一二三四五六七八九十]+)部", tag: "p$1" }
  - { kind: part, re: "(?:^|[^a-z])part\\s*([0-9]+)", tag: "p$1" }

# 概要欄の作品名の列挙（「A、B、Cを見ます」）。読点で2つ以上並べ、末尾がこの動詞の行を作品名の列挙として切り出す。
# 行の末尾の記号は作品名の一部のことがある（「キミとアイドルプリキュア♪」）ので、動詞の後ろの絵文字・記号だけを外す
description_list_verbs:
  - 見ます
  - 観ます
  - 視聴します
  - みます

# 照合用の正規化
match_normalize:
  # 取り除く記号（全角は NFKC で半角になってから適用）
  # 「+」は落とさない（「ズートピア」と「ズートピア+」は別作品）
  strip_chars: " \t　・･!！?？、。,.：:;；/／-‐－―~〜～…‥'\"“”‘’()（）[]［］「」『』【】〈〉《》☆★♪♡♥◆◇■□●○→←〆※*＊＃#&＆=＝|｜_"
  # 期・シーズンの表記ゆれを "seasonN" にそろえる
  season_patterns:
    - "第(\\d+)期"
    - "(\\d+)期"
    - "season(\\d+)"
    - "第(\\d+)シーズン"
    - "シーズン(\\d+)"
    # 数字の前に数字があれば期の番号にしない（「機動戦士ガンダム00 2nd season」の「00」を吸い込んで season002 にしない）
    - "(?<![0-9])(\\d{1,2})(?:st|nd|rd|th)season"
    - "(?<![0-9])(\\d{1,2})(?:st|nd|rd|th)シーズン"
  # 見た目が同じで別の文字を寄せる（ギリシャ文字のゼータ「Ζ」とラテン文字の「Z」。「機動戦士Ζガンダム」）
  fold_chars:
    "ζ": "z"
    "Ζ": "z"
    "Δ": "△"
    "δ": "△"
    # 「千年血戦篇」「遊郭編」: 篇と編は同じ語の書き分け
    "篇": "編"
  # ひらがなをカタカナに寄せる（「ゆるきゃん」と「ゆるキャン」）
  fold_kana: true

# 照会先ごとの設定
annict:
  # 1回の照会にまとめる検索語の数
  batch_size: 5
  per_query: 50
anilist:
  batch_size: 5
# Wikidata のラベル（日本語）の完全一致で同定する段。Wikipedia に記事の無い作品（「来る」「笑いのカイブツ」）用。
# アニメのDBで当たった区間の同名別作品の照合にも使う（「亜人」の実写映画は Wikidata にしか無い）
wikidata_label: true

wikipedia:
  # 完全一致が作品でない（小説・漫画・曖昧さ回避）ときに試す記事名の接尾辞
  title_suffixes:
    - " (映画)"
    - " (テレビドラマ)"
    - " (ドラマ)"
    - " (アニメ)"
    - " (特撮)"
    - " (テレビアニメ)"
  # Wikidata の P31（instance of）。作品として受け付けるクラスと、そのときの media
  work_classes:
    Q11424: movie        # 映画
    Q20650540: movie     # アニメ映画
    Q202866: movie       # アニメーション映画
    Q24862: movie        # 短編映画
    Q93204: movie        # ドキュメンタリー映画
    Q29168811: movie     # アニメーション長編映画
    Q5398426: tv         # テレビ番組シリーズ
    Q63952888: tv        # テレビアニメシリーズ
    Q1261214: tv         # 特別番組
    Q3464665: tv         # テレビシリーズのシーズン
    Q1259759: tv         # ミニシリーズ
    Q581714: tv          # アニメテレビシリーズ（一般）
    Q526877: web         # ウェブシリーズ
    Q220898: ova         # OVA
    Q1107: tv            # アニメ（汎用）
    Q506240: movie       # テレビ映画（「シャークネード」）
  # AI の判定（ai:apply）で受け付けるときだけ足す作品のクラス。ルールの照合には使わない（名寄せの結果を変えないため）。
  # 検証（audit-1）で AI が正しく選んだのに受け付けなかった項目のクラス: 仮面ライダーセイバー・ジオウ・ゼロワン（テレビ番組）、
  # 「薬屋のひとりごと 第1期」など（テレビアニメのシーズン）、「タコピーの原罪」など（アニメのWebシリーズ）
  ai_extra_work_classes:
    Q15416: tv           # テレビ番組
    Q100269041: tv       # テレビアニメのシーズン
    Q113671041: web      # アニメのWebシリーズ
    Q117467246: tv       # アニメーションのテレビシリーズ（海外のアニメ。「ホワット・イフ...?」。ai-run-1 で受け付けなかった）
  # アニメのクラス。アニメのDBで当たった区間を Wikipedia で照合するとき、これらは「同名の別作品」とみなさない
  # （「進撃の巨人 Season3」の記事はアニメ全体の記事へのリダイレクトで、公開年がずれるため）
  # 原作・作品の記事のクラス。Wikidata のラベルの段で、区間と同名の Wikipedia の記事がこれでも作品クラスでもなければ、
  # 区間は一般の語とみなして映画の枠のときだけ決める（「罰ゲーム」の記事はゲームの概念。「プラダを着た悪魔」の記事は小説）
  source_classes:
    - Q7725634   # 文学作品
    - Q8261      # 小説
    - Q47461344  # 著作物
    - Q571       # 本
    - Q21198342  # 漫画作品
    - Q8274      # 漫画
    - Q1004      # コミック
    - Q277759    # 本のシリーズ
    - Q1667921   # 小説のシリーズ
    - Q747381    # ライトノベル
    - Q196600    # メディア・フランチャイズ
    - Q7889      # ビデオゲーム
  anime_classes:
    - Q63952888
    - Q20650540
    - Q202866
    - Q29168811
    - Q581714
    - Q1107
    - Q220898
  # 映像の種類（anime / tokusatsu / live_action。UI の絞り込み用。src/resolve/enrich.ts）。Annict・AniList の作品はアニメ。
  # Wikidata の作品は、ジャンル（P136）に特撮があれば特撮、アニメーションのジャンルか anime_classes の分類（P31）があればアニメ、
  # 作品名に tokusatsu_title_words（仮面ライダー）があれば特撮、
  # シリーズ（P179。2段まで）・原作（P144）・フランチャイズ（P8345）のジャンルに特撮があれば特撮（それらが作品・シリーズ・フランチャイズのときだけ。
  # 原作がキャラクターの項目（「ゴジラ」はジャンルが特撮）からは受け継がない）、それ以外は実写。
  # 怪獣映画（ゴジラ・ガメラ）は実写（2026-10-02 決定。Wikidata のジャンル「怪獣」を特撮に数えない）。
  # 特撮は日本の作品に限る（tokusatsu_origin。原語（P364）が日本語。原語が無ければ制作国に日本。どちらも無ければ限らない）。
  # ハリウッドのゴジラは原作のゴジラが特撮でも実写（制作国には日本も入っているので原語で見る）
  tokusatsu_genres:
    - Q275934    # 特撮
    - Q124834075 # 特撮（別の項目）
  # 作品名にこれがあれば特撮（Wikidata にジャンル・シリーズ・フランチャイズが無い作品。仮面ライダーギーツ。2026-10-02 決定）
  tokusatsu_title_words:
    - 仮面ライダー
  # ジャンルを受け継ぐ項目の分類（work_classes に加えて）。フランチャイズ・映画シリーズ
  tokusatsu_inherit_classes:
    - Q196600    # メディア・フランチャイズ
    - Q24856     # 映画シリーズ
  tokusatsu_origin:
    language: Q5287  # 日本語
    country: JP
  animation_genres:
    - Q202866    # アニメーション映画
    - Q20650540  # アニメ映画
    - Q29168811  # アニメーション長編映画
    - Q1107      # アニメ
    - Q11425     # アニメーション
    - Q581714    # アニメテレビシリーズ
    - Q117467246 # アニメーションのテレビシリーズ
  # シリーズのまとめ（UI）にしない Wikidata のシリーズ（P179）の項目。P179 に一覧記事やスタジオの作品一覧が入ることがある
  series_excluded_classes:
    - Q13406463  # ウィキメディアの一覧記事（「BBC's 100 Greatest Films of the 21st Century」がインセプションとメメントをまとめていた）
  series_excluded:
    - Q26196748  # DreamWorks Animation feature films（スタジオの作品一覧）
    - Q56070713  # ウォルト・ディズニー・アニメーション・スタジオの映画（同）
  # シーズンの項目のクラス。実写（アニメのクラスでない）でシリーズ（P179）があれば、シリーズの項目に付け替える（2026-10-02 の決定 (b)。
  # 実写はシリーズ全体の項目にそろえる。「イカゲーム (シーズン2)」→「イカゲーム」、TXQ FICTION の各作品 →「TXQ FICTION」）。付け替えた作品には話数を付けない
  live_season_classes:
    - Q3464665   # テレビシリーズのシーズン
  # 作品ではないと分かるクラス（理由の表示用。受け付けないのは work_classes 以外すべて）
  not_work_classes:
    Q21198342: 漫画
    Q7725634: 文学作品
    Q196600: メディア・フランチャイズ
    Q15275719: 定期行事
    Q2155186: 放送枠
    Q5: 人物
    Q7889: ゲーム
    Q4167410: 曖昧さ回避

# AI の判定役に見せる手がかり（2026-10-02 決定。src/report/neighbors.ts）。ai-run-1 の採点で、保留の6件中5件が
# 同じ配信者のほかの枠か概要欄のリンク先で決まるものだった。ほかの枠のルールの答え・AI の答えは見せない（タイトルと日付だけ）
ai_context:
  neighbors: 3      # 前後それぞれの枠数
  same_name: 10     # 同じ作品名の枠の上限（この枠に近いものから）
  max_links: 3      # 1枠で題名を取りに行くリンクの数
  # 公開の枠では YouTube のコメント（上位）を見せる（視聴者のタイムスタンプに話数・作品名・どの版かが書かれていることが多い。2026-10-16）。
  # メン限の枠は取れない（403）。DB には持たず、待ち行列を作るたびに取る（1枠1ユニット）
  comments: 15
  comment_chars: 200
  # 題名を取りに行くリンク（正規表現）。ページの題名が取れないサイト（Disney+・U-NEXT・FOD）は入れない
  link_patterns:
    - '^https?://(www\.)?amazon\.co\.jp/(gp/video|dp|-/[a-z]+/dp)/'
    - '^https?://(www\.)?primevideo\.com/'
    - '^https?://amzn\.(asia|to)/'
    - '^https?://(www\.)?netflix\.com/([a-z-]+/)?title/'
    - '^https?://abema\.tv/video/'
    - '^https?://(www\.)?hulu\.jp/'
    - '^https?://eiga\.com/movie/'
    - '^https?://filmarks\.com/(movies|dramas|animes)/'
  # 作品名でない題名（取れなかったのと同じに扱う）
  generic_titles:
    - 'ページが見つかりません'
    - '[Pp]age [Nn]ot [Ff]ound'
    - '^Amazon\.co\.jp$'
    - '^エラー'
    - '^Netflix$'

# AI に回す型（src/resolve/route.ts の型、または not_a_work_rule:スポーツ のような層）。この型の枠は AI が確かめるまでサイトに出さない。
# 2026-10-01 に audit-1〜3（型ごとの抽出と候補を見ない AI との突き合わせ）で誤りが見つかった型。公開後は型ごとの AI との一致率で増減する
# series は 2026-10-02 に追加（AI の判定を根拠に新しく付いたアイカツの枠で、「第二期」をアイカツスターズ！と読み違えた・「スターズ」を副題と読んだ）
ai_routes:
  - series
  - tiebreak
  - sub_desc_tag
  - disambiguation
  - prefix_sibling
  - redirect
  - live_action_tv
  - not_a_work_conflict
  - unidentifiable_rule
  - unresolved
