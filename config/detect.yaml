# 同時視聴枠の判定語彙（detect）
#
# - 照合は部分一致。「同時視聴」で「同時視聴会」「#同時視聴」も拾えるので派生語は列挙しない
# - 語を足すコストは誤検出。「実況」のようにゲーム実況を大量に拾う語は入れない
# - このファイルを変えると判定バージョン（内容のハッシュ）が変わり、
#   `npm run cli -- detect:rerun` で過去に見た動画を再判定できる

# 照合前の正規化。タイトル原文（title_raw）は書き換えず、照合用の文字列だけに適用する
normalize:
  nfkc: true            # 全角英数・半角カナのゆれを吸収
  lowercase: true
  # 照合前に取り除く文字。「同時 視聴」「watch-along」「Watch Along」をそろえる
  strip_chars: " \t　・･-_‐－―"

# タイトルの判定
title:
  include:
    - 同時視聴
    - 同時試聴           # 誤字。実データで常用するチャンネルがある
    - ミラー配信
    - ウォッチパーティ     # 「ウォッチパーティー」も部分一致で拾う
    - watchalong           # watch along / watch-along も strip_chars で同じ形になる
    - 同時鑑賞
    # 英語のタイトル（2026-10-02。NIJISANJI EN・hololive EN を対象に入れたとき、保存済みの全タイトルで確かめた）
    - watching party       # 大空スバルの「Fate/stay night watching party」など。16本すべて同時視聴
    - movie night          # EN の「【MEMBER'S ONLY】Movie Night! Hogfather (2006)」など。9本すべて同時視聴
    # タイトルの先頭か括弧の直後の「Watching ...」（「Watching Breaking Bad S5 part 2」）。25本中24本が同時視聴（外れは「Watching My Own Stream」）。
    # 文中の watching（「BIG ROCO IS WATCHING YOU」「while watching the MAP」）は拾わない。「watch party」は eスポーツの観戦が大半なので入れない
    - 're:(^|[】\])|｜>(\[【「『])watching'
  # include に当たっても、これを含むタイトルは同時視聴枠として扱わない
  exclude:
    - 同時視聴者           # 「同時視聴者数◯万人記念」など
    - 同時視聴前           # 「同時視聴前に待ち合わせ！」など、同時視聴の前の前座・待機枠（同時視聴枠ではない）

# 概要欄の判定。概要欄は「ミラー配信・同時視聴はご遠慮ください」のような
# 注意書きが定型で入るので、行単位で見て否定語を含む行は無視する
description:
  enabled: true
  # 同じチャンネルの動画のうち、この本数以上に同じ行が出てくれば定型文（チャンネル紹介・
  # メンバー特典の一覧など）とみなして無視する。RSS は約15本、playlistItems は最大50本ずつ見る
  template_min_repeats: 3
  include:
    - 同時視聴
    - 同時試聴
    - ミラー配信
    - ウォッチパーティ
    - watchalong
    - 同時鑑賞
  exclude:
    - 同時視聴者
  # include を含む行のうち、その枠自体を指す語を含む行だけをヒットにする。
  # 過去・予定への言及（「同時視聴おやすみ」「同時視聴再生リスト」など）を拾わないため。
  # 2026-09-23 の実データで概要欄ヒット314件がこの条件で22件になり、残りの半数以上が本物だった
  line_require:
    - 今日
    - 本日
    - 今回
    - この配信
    - この枠
    - 今夜
    - 今から
    # 「A、B、Cを見ます」のように、その枠で観る作品を書いた行。名寄せの概要欄の段（作品名の列挙）でも使う
    - を見ます
    - を観ます
  # include を含む行でも、これらを含む行はヒットにしない。
  # "re:" で始まる項目は正規表現（正規化後の文字列に適用）
  line_exclude:
    - 遠慮
    - 禁止
    - "re:(^|[^a-z])ng([^a-z]|$)"   # 「NG」。streaming などの英単語は除く
    - お控え
    - 控えて
    - しないで
    - おやめ
    - やめて
    - ダメ
    - だめ
    - 不可
    - 無断
    # 視聴者向けの二次利用ルール（「切り抜き・ミラー配信はガイドラインを確認」など）
    - ガイドライン
    - 切り抜き
    - 許可
    - 可能
    - "re:(^|[^a-z])ok([^a-z]|$)"

# 判定後の除外条件
reject:
  # ライブ配信（プレミア公開を含む）でない動画も除外しない。
  # Twitch での同時視聴を YouTube に再アップしたものがあり、中身は同時視聴のため。
  # その場合 actualStartTime が無いので started_at は publishedAt で代用し、started_at_source に記録する
  require_live: false

# メン限枠の判定（除外条件ではなく表示属性）。タイトルにこれを含めば is_members_only
members_only:
  title_include:
    - メン限
    - メンバー限定
    - メンバーシップ限定
    - membersonly
    - memberonly
    - membershiponly     # 「Membership Only」。予定枠の段階ではメン限プレイリストに載らないため、タイトルで拾う
    - member'sonly        # 「【member's only】」（EN）。アポストロフィは取り除かない
    - membersstream       # 「【MEMBERS STREAM】」（EN）
    - member'sstream
    - memberswatchalong   # 「【MEMBERS WATCHALONG】」（EN）
    - "[member's]"        # 「[MEMBER'S]」（EN）

# 判定には使わない。取りこぼし調査用に「ヒットしなかったがこれを含むタイトル」を抽出する
review_hints:
  - 視聴
  - 鑑賞
  - 観る
  - 観よう
  - 観た
  - 見よう
  - みよう
  - みる
  - 上映
  - watch
  - ミラー
  - 一緒に見
  - 一緒に観
  - リアクション
  - reaction
