# 巡回とクォータの設定
#
# YouTube Data API は 10,000 ユニット/日（太平洋時間の0時にリセット）。
# playlistItems.list / videos.list / channels.list は1回1ユニット、search.list は100ユニット。

quota:
  daily_limit: 10000
  # 1日の使用量がこれを超えたら、以降のAPI呼び出しをすべて止める（使い切らないための余白）
  stop_at: 9000
  # ジョブ1回あたりの上限
  per_run:
    hourly: 300
    daily: 6000

rss:
  # チャンネルRSS。クォータを消費しない
  url: "https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}"

hourly:
  # 予定枠は RSS にも載る（2026-09-23 の実データで40件すべて）。API による担保として、
  # 毎時 playlistItems で一部のチャンネルを順番に見る。各チャンネルを何時間ごとに見るか。
  # 240チャンネルで 12 なら毎時20ユニット（約480/日）。浮いた予算は Tier 2 用に確保する
  playlist_scan_interval_hours: 12
  playlist_scan_page_size: 10

upcoming:
  # 開始が今からこの日数以上先の予定枠は除外する（予定表代わりに2028年開始などで立てた枠）。
  # 行は残し、名寄せと公開の対象から外す。日付が近づけば対象に戻る
  max_days_ahead: 30

daily:
  # 全チャンネルの uploads の先頭ページ
  playlist_page_size: 50
  # メン限動画のプレイリスト（UUMO...）も見る。API で取れない場合は自動で記録して飛ばす
  members_playlist: true

backfill:
  # 過去分の遡り。日次ジョブで余ったクォータの範囲で古いページへ進む
  enabled: true
  max_units_per_run: 3000
  # これより古い動画に達したらそのチャンネルの遡りを終える（null なら最後まで）
  since: null

refresh:
  # videos.list で1バッチ（最大50件）中の欠落がこの割合を超えたら、
  # API側の異常とみなしてアーカイブ消失の判定を見送る（取得失敗時に既存データを消さない）
  max_missing_ratio: 0.5
  # 上の判定を適用する最小バッチサイズ（少数のバッチは1件消えただけで割合が跳ねるため）
  min_batch_for_ratio: 10

http:
  timeout_ms: 20000
  retries: 3
  # ホストごとのリクエスト間隔（逐次リクエスト）
  min_interval_ms:
    default: 300
    "www.youtube.com": 150
    "www.googleapis.com": 0
    "www.nijisanji.jp": 500
    "hololive.hololivepro.com": 500
    "vspo.jp": 500
  user_agent: "Mozilla/5.0 (compatible; doji-shicho-matome/0.1)"
